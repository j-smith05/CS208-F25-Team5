<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Game</title>
    <link rel="stylesheet" href="css/style3.css">
</head>
<body>

<!-- Team Name Setup -->
<div class="team-setup">
    <h2>Enter Team Names</h2>

    <label>
        Player 1 Name:
        <input id="team1-name-input" type="text" placeholder="Player 1">
    </label>
    <br><br>

    <label>
        Player 2 Name:
        <input id="team2-name-input" type="text" placeholder="Player 2">
    </label>
    <br><br>

    <button id="start-game-btn" class="reset-button">Start Game</button>
</div>

<!-- Scoreboard hor -->
<div class="scoreboard">
    <div class="team1-score">
        <label id="team1-name-label" for="team1-score">Player 1:</label>
        <span id="team1-score">0</span>
    </div>
    <div class="team2-score">
        <label id="team2-name-label" for="team2-score">Player 2:</label>
        <span id="team2-score">0</span>
    </div>
</div>

<!-- Timer Stuff -->
<div id="timer-display" class="timer-box" style="display: none;">10</div>

<div class="controls">
    <button id="pause-timer-btn" class="reset-button">Pause Timer</button>
    <button id="resume-timer-btn" class="reset-button">Resume Timer</button>
    <button id="cancel-timer-btn" class="reset-button">Cancel Timer</button>
</div>


<!-- Game Board -->
<div class="table-container">
    <table class="my-table">
        <thead>
        <tr>
            <th>Movies &amp; TV</th>
            <th>History</th>
            <th>Video Games</th>
            <th>Sports</th>
            <th>Music</th>
        </tr>
        </thead>
        <tbody>

        <!-- 100 row -->
        <tr>
            <td data-category="Movies &amp; TV" data-points="100"><div class="clue-points">100</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="History" data-points="100"><div class="clue-points">100</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Video Games" data-points="100"><div class="clue-points">100</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Sports" data-points="100"><div class="clue-points">100</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Music" data-points="100"><div class="clue-points">100</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
        </tr>

        <!-- 200 row -->
        <tr>
            <td data-category="Movies &amp; TV" data-points="200"><div class="clue-points">200</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="History" data-points="200"><div class="clue-points">200</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Video Games" data-points="200"><div class="clue-points">200</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Sports" data-points="200"><div class="clue-points">200</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Music" data-points="200"><div class="clue-points">200</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
        </tr>

        <!-- 300 row -->
        <tr>
            <td data-category="Movies &amp; TV" data-points="300"><div class="clue-points">300</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="History" data-points="300"><div class="clue-points">300</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Video Games" data-points="300"><div class="clue-points">300</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Sports" data-points="300"><div class="clue-points">300</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Music" data-points="300"><div class="clue-points">300</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
        </tr>

        <!-- 400 row -->
        <tr>
            <td data-category="Movies &amp; TV" data-points="400"><div class="clue-points">400</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="History" data-points="400"><div class="clue-points">400</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Video Games" data-points="400"><div class="clue-points">400</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Sports" data-points="400"><div class="clue-points">400</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Music" data-points="400"><div class="clue-points">400</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
        </tr>

        <!-- 500 row -->
        <tr>
            <td data-category="Movies &amp; TV" data-points="500"><div class="clue-points">500</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="History" data-points="500"><div class="clue-points">500</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Video Games" data-points="500"><div class="clue-points">500</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Sports" data-points="500"><div class="clue-points">500</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
            <td data-category="Music" data-points="500"><div class="clue-points">500</div><div class="clue-content hidden"><p class="clue-question"></p><p class="clue-answer hidden"></p></div></td>
        </tr>

        </tbody>
    </table>
</div>


<!-- Reset Button -->
<div class="controls">
    <button id="reset-btn" class="reset-button">New Game / Reset Board</button>
</div>

<p><a href="index.html">Back to index</a></p>

<hr>

<!-- Include your JavaScript -->
<script type="module" src="js/jeopardy3.js"></script>

</body>
</html>
