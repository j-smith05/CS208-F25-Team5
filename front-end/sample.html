<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Jeopardy Game Board</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header>
    <h1>Jeopardy Game Board</h1>
</header>

<!-- Scoreboard -->
<section class="scoreboard">
    <div class="player-score">
        <label for="player1-score">Player 1 Score:</label>
        <span id="player1-score">0</span>
    </div>
    <div class="player-score">
        <label for="player2-score">Player 2 Score:</label>
        <span id="player2-score">0</span>
    </div>
</section>

<!-- Game Board -->
<section class="table-container">
    <table class="game-board">
        <thead>
        <tr>
            <th>Sports</th>
            <th>Music</th>
            <th>History</th>
            <th>Quotes</th>
            <th>Misc.</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td data-category="Sports" data-points="200">
                <button class="tile">200</button>
                <div class="clue-content hidden">
                    <p class="clue-question">This is the clue the players see.</p>
                    <p class="clue-answer hidden">What is the correct response?</p>
                </div>
            </td>
            <td data-category="Music" data-points="200">
                <button class="tile">200</button>
                <div class="clue-content hidden">
                    <p class="clue-question">He was known as the "King of Pop."</p>
                    <p class="clue-answer hidden">Who is Michael Jackson?</p>
                </div>
            </td>
            <td><button class="tile">200</button></td>
            <td><button class="tile">200</button></td>
            <td><button class="tile">200</button></td>
        </tr>
        <tr>
            <td><button class="tile">400</button></td>
            <td><button class="tile">400</button></td>
            <td><button class="tile">400</button></td>
            <td><button class="tile">400</button></td>
            <td><button class="tile">400</button></td>
        </tr>
        <tr>
            <td><button class="tile">600</button></td>
            <td><button class="tile">600</button></td>
            <td><button class="tile">600</button></td>
            <td><button class="tile">600</button></td>
            <td><button class="tile">600</button></td>
        </tr>
        <tr>
            <td><button class="tile">800</button></td>
            <td><button class="tile">800</button></td>
            <td><button class="tile">800</button></td>
            <td><button class="tile">800</button></td>
            <td><button class="tile">800</button></td>
        </tr>
        <tr>
            <td><button class="tile">1000</button></td>
            <td><button class="tile">1000</button></td>
            <td><button class="tile">1000</button></td>
            <td><button class="tile">1000</button></td>
            <td><button class="tile">1000</button></td>
        </tr>
        </tbody>
    </table>
</section>

<footer>
    <p><a href="index.html">Back to index</a></p>
</footer>

<script src="js/sample.js"></script>
</body>
</html>
