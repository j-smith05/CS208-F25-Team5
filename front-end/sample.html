<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sample</title>

<body>
<div class="table-container">
    <table class = "my-table">
        <thead>
        <tr>
            <th>Sports</th>
            <th>Music</th>
            <th>History</th>
            <th>Quotes</th>
            <th>Misc.</th>
        </tr>
        </thead>
        <tbody>
        <tr>
            <td data-category="Sports" data-points="200">
                <div class="clue-points">200</div>
                <div class="clue-content">
                    <p class="clue-question">This is the clue the players see.</p>
                    <p class="clue-answer">What is the correct response?</p>
                </div>
            </td>
            <td data-points="200" data-category="Music">
                <div class="clue-points">200</div>
                <div class="clue-content hidden">
                    <p class="clue-question">He was known as the "King of Pop."</p>
                    <p class="clue-answer hidden">Who is Michael Jackson?</p>
                </div>
            </td>
            <td>200</td>
            <td>200</td>
            <td>200</td>
        </tr>
        <tr>
            <td>400</td>
            <td>400</td>
            <td>400</td>
            <td>400</td>
            <td>400</td>
        </tr>
        <tr>
            <td>600</td>
            <td>600</td>
            <td>600</td>
            <td>600</td>
            <td>600</td>
        </tr>
        <tr>
            <td>800</td>
            <td>800</td>
            <td>800</td>
            <td>800</td>
            <td>800</td>
        </tr>
        <tr>
            <td>1000</td>
            <td>1000</td>
            <td>1000</td>
            <td>1000</td>
            <td>1000</td>
        </tr>
        </tbody>
    </table>
</div>

</body>

</html>
